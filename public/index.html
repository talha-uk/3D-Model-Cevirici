<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3B çevirici</title>
  <link rel="stylesheet" href="/stil.css">
</head>
<body>
  <main>
    <h1 id="baslik">3B çevirici</h1>

    <form id="form" action="/api/donustur" method="post" aria-labelledby="baslik">
      <button type="button" id="sec">Dosya seç</button>
      <p id="sec-hata" class="hata" hidden></p>
      <ul id="secilen"></ul>
      <label for="hedef">Hedef biçim</label>
      <select id="hedef" name="hedef" required>
        <optgroup label="Ağ">
          <option value="glb" selected>GLB</option>
          <option value="gltf">glTF</option>
          <option value="obj">OBJ</option>
          <option value="stl">STL</option>
          <option value="ply">PLY</option>
          <option value="dae">Collada</option>
        </optgroup>
        <optgroup label="CAD">
          <option value="step">STEP</option>
        </optgroup>
      </select>
      <button type="submit" id="gonder">Dönüştür</button>
    </form>

    <section aria-labelledby="sonuc-baslik">
      <h2 id="sonuc-baslik">Sonuç</h2>
      <div id="ilerleme-kutu" hidden>
        <label for="ilerleme">İlerleme</label>
        <progress id="ilerleme" max="1" value="0"></progress>
      </div>
      <p id="durum" role="status"></p>
      <ul id="sonuclar"></ul>
    </section>
  </main>
  <script src="/uygulama.js"></script>
</body>
</html>
